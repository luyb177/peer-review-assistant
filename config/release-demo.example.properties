# Copy to release-demo.local.properties only when explicitly preparing a course-demo release.
# Use isolated, revocable demo credentials, never database root or a development account.
db.url=jdbc:mysql://YOUR_HOST:3306/YOUR_DEMO_DATABASE?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=15000&sslMode=VERIFY_IDENTITY
db.user=YOUR_DEMO_USER
db.password=YOUR_DEMO_PASSWORD
db.trustStore=
db.trustStorePassword=
ai.enabled=true
ai.protocol=openai-compatible
ai.baseUrl=https://YOUR_PUBLIC_API/v1
ai.apiKey=YOUR_DEMO_KEY
ai.model=YOUR_MODEL
ai.timeoutSeconds=30
ai.useEnvironmentKey=false
ai.refusalFallback=auto
course.demo.db=true
course.demo.ai=true
course.notice=默认服务仅供课程验收，课程结束后关闭；后续请切换自己的 MySQL 和 AI 配置。
demo.teacher.username=teacher
demo.teacher.password=YOUR_DEMO_TEACHER_PASSWORD
