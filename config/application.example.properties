# Copy to config/application.properties; never commit real credentials.
# Supports remote MySQL 8.x; create a dedicated database first.
db.url=jdbc:mysql://YOUR_HOST:3306/peer_review_assistant?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=15000&sslMode=VERIFY_IDENTITY
db.user=peer_review
db.password=
# Optional pinned MySQL CA trust store, relative to this config directory.
db.trustStore=
db.trustStorePassword=
ai.enabled=false
ai.baseUrl=https://api.anthropic.com
ai.model=claude-opus-5-5
ai.timeoutSeconds=90
# auto: enable refusal fallback only on the official Anthropic endpoint, not local gateways.
ai.refusalFallback=auto
# PEER_REVIEW_AI_KEY overrides the file value.
ai.apiKey=
